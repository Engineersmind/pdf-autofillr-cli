[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-autofillr-cli"
version = "0.2.1"
description = "Unified CLI for all pdf-autofillr modules"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Engineers Mind", email = "Support@pdffillr.ai"}
]
keywords = ["pdf", "cli", "autofill", "command-line", "form-filling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

# Full SDK is the only dependency — all modules included
dependencies = [
    "pdf-autofillr[all]>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
]

[project.scripts]
pdf-autofillr-cli = "pdf_autofillr_cli.main:main"

[project.urls]
Homepage      = "https://github.com/Engineersmind/pdf-autofillr-cli"
Documentation = "https://github.com/Engineersmind/pdf-autofillr-cli/tree/main/cli"
Repository    = "https://github.com/Engineersmind/pdf-autofillr-cli"
Issues        = "https://github.com/Engineersmind/pdf-autofillr-cli/issues"
Platform      = "https://pdffillr.ai"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pdf_autofillr_cli = ["USAGE.md", "usage/*.md"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
