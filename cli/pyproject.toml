[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-autofillr-cli"
version = "0.1.1"
description = "Unified CLI for all pdf-autofillr modules"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "PDF AutoFillr Team", email = "team@pdf-autofiller.com"}
]
keywords = ["pdf", "cli", "autofill", "command-line"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

# Only hard dependency is the umbrella package
dependencies = [
    "pdf-autofillr>=1.1.0",
]

[project.optional-dependencies]
# Install with specific modules
chatbot    = ["pdf-autofillr[chatbot]"]
rag        = ["pdf-autofillr[rag]"]
mapper     = ["pdf-autofillr[mapper]"]
doc-upload = ["pdf-autofillr[doc-upload]"]
all        = ["pdf-autofillr[all]"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]

[project.scripts]
pdf-autofillr = "pdf_autofillr_cli.main:main"

[project.urls]
Homepage      = "https://github.com/Engineersmind/pdf-autofillr"
Documentation = "https://github.com/Engineersmind/pdf-autofillr/tree/main/packages/cli"
Repository    = "https://github.com/Engineersmind/pdf-autofillr"
Issues        = "https://github.com/Engineersmind/pdf-autofillr/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
