name: Release

# Triggered by pushing a tag matching cli-v*.
# Complements publish-pypi.yml — that workflow handles the PyPI OIDC publish.
# This workflow handles: GitHub Release creation + dist artifact attachment.
#
# Release steps:
#   1. Bump version in cli/pyproject.toml
#   2. Update cli/CHANGELOG.md and root CHANGELOG.md
#   3. Merge to main
#   4. git tag cli-v0.3.0 && git push origin cli-v0.3.0
#
# Both this workflow and publish-pypi.yml fire on the same tag.
# They are independent — publish-pypi.yml does PyPI, this does GitHub Releases.

on:
  push:
    tags:
      - 'cli-v*'

jobs:
  # ── 1. Verify & test ─────────────────────────────────────────────────────────
  verify:
    name: Verify / Python 3.12
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]" --no-deps 2>/dev/null || pip install pytest pytest-cov ruff black isort mypy build twine

      - name: ruff check
        run: ruff check src/ tests/

      - name: black check
        run: black --check src/ tests/

      - name: Confirm version matches tag
        run: |
          PKG=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          TAG="${GITHUB_REF_NAME#cli-v}"
          echo "Tag=$TAG  pyproject=$PKG"
          [ "$TAG" = "$PKG" ] || (echo "ERROR: version mismatch — bump pyproject.toml before tagging" && exit 1)

      - name: Run tests
        run: pytest tests/ --tb=short -q

  # ── 2. Build distribution ────────────────────────────────────────────────────
  build:
    name: Build dist
    runs-on: ubuntu-latest
    needs: verify
    defaults:
      run:
        working-directory: cli

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel + sdist
        run: |
          pip install build>=1.0.0 twine>=5.0.0
          python -m build
          twine check dist/*

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-pdf-autofillr-cli-${{ github.ref_name }}
          path: cli/dist/
          retention-days: 30

  # ── 3. GitHub Release ────────────────────────────────────────────────────────
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-pdf-autofillr-cli-${{ github.ref_name }}
          path: dist/

      - name: Extract changelog entry for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#cli-v}"
          # Extract the block for this version from cli/CHANGELOG.md
          ENTRY=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" cli/CHANGELOG.md)
          if [ -z "$ENTRY" ]; then
            ENTRY="See cli/CHANGELOG.md for details."
          fi
          # Write to file to avoid quoting issues
          echo "$ENTRY" > /tmp/release_notes.txt
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "pdf-autofillr-cli v${{ steps.changelog.outputs.version }}"
          body_path: /tmp/release_notes.txt
          files: dist/*
          draft: false
          prerelease: false